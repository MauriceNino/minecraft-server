[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "minecraft-server"
dynamic = ["version"]
description = "Docker image that sets up and runs Minecraft servers and proxies from environment variables: server JAR, plugins, config templates and RCON."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12"
authors = [{ name = "MauriceNino" }]

dependencies = [
    "rich>=13.9",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "tomlkit>=0.13",
    "click>=8.1",
    "ruamel-yaml>=0.18",
    "mcrcon>=0.7",
    "pyhocon>=0.3.60",
    "pillow>=13.0.0",
    "websockets>=14",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.35",
    "ruff>=0.8",
    "pyright>=1.1",
]

[project.scripts]
mc-orchestrator = "orchestrator.__main__:main"
mc-rcon = "rcon.__main__:main"
mc-msmp = "msmp.__main__:main"

# The version comes from the Git tag (vMAJOR.MINOR.PATCH). Without .git (the Docker build), set
# SETUPTOOLS_SCM_PRETEND_VERSION instead.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Only `v*` tags are versions, the old date-based tags aren't
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"]

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator", "src/rcon", "src/msmp"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "N",   # pep8-naming
    "ANN", # flake8-annotations
    "ASYNC", # flake8-async
    "S",   # flake8-bandit (security)
    "T20", # flake8-print
    "PT",  # flake8-pytest-style
]
ignore = [
    "ANN401", # dynamically typed expressions (Any)
    "S101",   # assert used (needed in tests)
    "S311",   # pseudo-random generators (not crypto)
]

[tool.ruff.lint.isort]
known-first-party = ["orchestrator", "rcon", "msmp"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
