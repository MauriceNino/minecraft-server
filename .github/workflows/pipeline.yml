name: Pipeline

on:
  push:
    branches: ["**"]
    # A release: pushing a `vMAJOR.MINOR.PATCH` tag builds every Java variant and creates the GitHub release
    tags: ["v*"]
  pull_request:
    branches: ["**"]

env:
  GHCR_IMAGE: ghcr.io/mauricenino/minecraft-server
  DOCKERHUB_IMAGE: mauricenino/minecraft-server

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        # The image uses 3.12, the others make sure `requires-python = ">=3.12"` holds
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff lint
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Pyright type check
        run: uv run pyright src/

      - name: Run tests
        run: uv run pytest

  smoke-test:
    name: Smoke Test
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: minecraft-server:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # As a UID that isn't in the image, writing to the volume Docker creates from the image
      - name: Start a Paper server
        run: |
          docker run -d --name smoke --user 1234:1234 \
            -e TYPE=PAPER -e VERSION=latest -e ACCEPT_EULA=true -e MEMORY=1G \
            -e PLUGINS="modrinth:luckperms@latest" \
            minecraft-server:smoke

      - name: Wait until healthy
        run: |
          for _ in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' smoke 2>/dev/null || echo missing)
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            [ "$(docker inspect --format '{{.State.Running}}' smoke)" = true ] || break
            sleep 10
          done
          exit 1

      - name: Check RCON and plugins
        run: |
          docker exec smoke mc-rcon list
          docker exec smoke mc-rcon plugins | tee plugins.txt
          grep -i luckperms plugins.txt

      - name: Show logs
        if: always()
        run: docker logs smoke 2>&1 | tail -200

  deploy-image:
    name: Build & Push
    needs: [test, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # 8, 11 and 17 are only built with Temurin, for Minecraft versions before 1.17
        java-version: [8, 11, 17, 21, 23, 25]
        java-flavor: [temurin, corretto, microsoft, azul, graalvm]
        is-release: ["${{ startsWith(github.ref, 'refs/tags/v') }}"]
        exclude:
          # Version 23 does not exist for microsoft
          - java-flavor: microsoft
            java-version: 23
          - { java-version: 8, java-flavor: corretto }
          - { java-version: 8, java-flavor: microsoft }
          - { java-version: 8, java-flavor: azul }
          - { java-version: 8, java-flavor: graalvm }
          - { java-version: 11, java-flavor: corretto }
          - { java-version: 11, java-flavor: microsoft }
          - { java-version: 11, java-flavor: azul }
          - { java-version: 11, java-flavor: graalvm }
          - { java-version: 17, java-flavor: corretto }
          - { java-version: 17, java-flavor: microsoft }
          - { java-version: 17, java-flavor: azul }
          - { java-version: 17, java-flavor: graalvm }
          # Outside of releases, only build Java 25 Temurin to save resources
          - is-release: false
            java-version: 8
          - is-release: false
            java-version: 11
          - is-release: false
            java-version: 17
          - is-release: false
            java-version: 21
          - is-release: false
            java-version: 23
          - is-release: false
            java-flavor: corretto
          - is-release: false
            java-flavor: microsoft
          - is-release: false
            java-flavor: azul
          - is-release: false
            java-flavor: graalvm

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          # A `v*` tag push is a release, and a tag with a `-` (e.g. `v1.0.0-rc.1`) a prerelease
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
          IS_STABLE: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
          IS_DEFAULT: ${{ matrix.java-version == 25 && matrix.java-flavor == 'temurin' }}
          SUFFIX: -java${{ matrix.java-version }}-${{ matrix.java-flavor }}
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          # Otherwise every variant of a release would push latest, the rule below sets it for the default combo only
          flavor: latest=false
          # Prereleases only get the full version, the semver patterns skip the shorter ones for them
          tags: |
            # Releases: <version>-java<version>-<flavor>, e.g. 1.2.3-java25-temurin, 1.2-java25-temurin, 1-java25-temurin
            type=semver,pattern={{version}},suffix=${{ env.SUFFIX }},enable=${{ env.IS_RELEASE }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ env.SUFFIX }},enable=${{ env.IS_RELEASE }}
            type=semver,pattern={{major}},suffix=${{ env.SUFFIX }},enable=${{ env.IS_RELEASE }}
            # Stable releases: java<version>-<flavor> points to the newest release
            type=raw,value=java${{ matrix.java-version }}-${{ matrix.java-flavor }},enable=${{ env.IS_STABLE }}
            # Releases of the default combo (Java 25 Temurin): the plain version, e.g. 1.2.3, 1.2, 1
            type=semver,pattern={{version}},enable=${{ env.IS_RELEASE == 'true' && env.IS_DEFAULT == 'true' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ env.IS_RELEASE == 'true' && env.IS_DEFAULT == 'true' }}
            type=semver,pattern={{major}},enable=${{ env.IS_RELEASE == 'true' && env.IS_DEFAULT == 'true' }}
            # Stable releases of the default combo: latest
            type=raw,value=latest,enable=${{ env.IS_STABLE == 'true' && env.IS_DEFAULT == 'true' }}
            # Every commit on main (default combo only): edge, and sha-<commit> to pin one
            type=raw,value=edge,enable=${{ env.IS_MAIN }}
            type=sha,prefix=sha-,enable=${{ env.IS_MAIN }}
            # Other branches: the branch name
            type=ref,event=branch,enable=${{ env.IS_MAIN != 'true' && env.IS_RELEASE != 'true' }}

      # The version of a release comes from its tag, any other build gets a development version
      - name: Get version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0.dev0+g${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            JAVA_VERSION=${{ matrix.java-version }}
            JAVA_FLAVOR=${{ matrix.java-flavor }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-docs:
    name: Build & Deploy Docs
    needs: deploy-image
    # Only stable releases, so the docs always describe the image behind `latest`
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: docs

      - name: Build static site
        run: bun run build
        working-directory: docs
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Create Release
    needs: deploy-image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate Grouped Release Notes
        run: python3 .github/scripts/release_notes.py "$GITHUB_REF_NAME"
        env:
          # Looks up the GitHub usernames of the commit authors
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          prerelease=()
          [[ "$TAG_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG_NAME" --verify-tag --title "$TAG_NAME" --notes-file notes.md "${prerelease[@]}"
